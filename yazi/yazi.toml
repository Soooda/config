[mgr]
# show_hidden = true
sort_by = "natural"
linemode = "size"
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
	{ run = '${EDITOR:=nvim} %s', desc = "$EDITOR", block = true, for = "unix" },
	{ run = 'code %s', orphan = true, for = "unix" },
]
archive = [
	{ run = 'unar %s1', desc = "Extract here", for = "unix" },
]

[open]
rules = [
	# Folder
	{ mime = "folder/*", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Code
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal", "archive" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Fallback - open in editor first
	{ url = "*", use = [ "edit", "open", "reveal" ] },
]
